name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # A tag is authoritative; otherwise derive from the source so every
          # build is identifiable without editing a file.
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF -replace "^refs/tags/v", ""
          } else {
            $short = $env:GITHUB_SHA.Substring(0, 7)
            $v = "0.0.0-dev.$short"
          }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$v"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build Windows exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $ldflags = "-s -w -H=windowsgui -X main.version=${{ steps.version.outputs.value }}"
          go build -trimpath -buildvcs=false -ldflags $ldflags -o dist/fastlink-tool.exe ./cmd/fastlink-tool
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          $exe = Get-Item dist/fastlink-tool.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $hash | Set-Content dist/fastlink-tool.exe.sha256 -Encoding ASCII
          Write-Host ("fastlink-tool.exe {0:N0} bytes" -f $exe.Length)
          Write-Host "sha256 $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastlink-tool-${{ steps.version.outputs.value }}-windows-amd64
          path: |
            dist/fastlink-tool.exe
            dist/fastlink-tool.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    # Only a v* tag publishes a release; branch pushes just leave an artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && zip -r "../${dir%/}.zip" .)
          done
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
